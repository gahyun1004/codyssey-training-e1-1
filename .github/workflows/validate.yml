name: Validate E1-1 Repository

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate repository structure and syntax
        run: bash scripts/ubuntu/validate-repository.sh

      - name: Build Docker image
        run: docker build -t codyssey-e1-1-web:ci .

      - name: Run HTTP smoke test
        run: |
          docker run -d --name e1-1-ci -p 127.0.0.1:18080:80 codyssey-e1-1-web:ci
          for attempt in {1..20}; do
            if curl -fsS http://127.0.0.1:18080/ | grep -q "Codyssey E1-1"; then
              exit 0
            fi
            sleep 1
          done
          docker logs e1-1-ci
          exit 1

      - name: Cleanup
        if: always()
        run: docker rm -f e1-1-ci 2>/dev/null || true
